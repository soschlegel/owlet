name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: "Build and publish owlet.zip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify tag matches manifest version"
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/owlet/manifest.json)
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi

      - name: "Build owlet.zip"
        run: |
          cd custom_components/owlet
          zip -r ../../owlet.zip . -x '*/__pycache__/*' -x '__pycache__/*'

      - name: "Publish GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          files: owlet.zip
          generate_release_notes: true
